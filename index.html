<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قصر الشواية | Qasr Al-Shawaya</title>
    
    <!-- خطوط جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ملفات التنسيق المعزولة -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/buttons.css">
</head>
<body>

    <!-- 1. مكون الهيدر -->
    <header class="main-header">
        <div class="header-container">
            <!-- اللوجو -->
            <div class="logo">
                <h1>قصر الشواية</h1>
                <span>Qasr Al-Shawaya</span>
            </div>
            
            <!-- روابط التنقل -->
            <nav class="main-nav">
                <a href="#home" class="active">الرئيسية</a>
                <a href="#menu">المنيو</a>
                <a href="#charity">إفطار صائم</a>
                <a href="#contact">تواصل معنا</a>
            </nav>

            <!-- زر اللغة -->
            <div class="header-actions">
                <button class="lang-btn">EN</button>
                <!-- زرار الموبايل (برجر مينيو) -->
                <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </header>

    <!-- 2. مكون الواجهة الرئيسية (Hero) -->
    <section class="hero-section" id="home">
        <div class="hero-content">
            <!-- شارة التقييم ومواعيد العمل -->
            <div class="hero-badges">
                <span class="badge rating"><i class="fas fa-star"></i> 4.7 (1,619 تقييم)</span>
                <span class="badge open-time"><i class="fas fa-clock"></i> مفتوح حتى 3 صباحاً</span>
            </div>
            
            <h2 class="hero-title">أصالة الطعم.. وفخامة التقديم</h2>
            <p class="hero-subtitle">استمتع بأشهى دجاج شواية على الفحم مع الأرز البخاري الأصيل في قلب مكة المكرمة.</p>
            
            <!-- أزرار الواجهة -->
            <div class="hero-buttons">
                <a href="#menu" class="btn-primary">تصفح المنيو</a>
                <a href="#about" class="btn-secondary">قصتنا</a>
            </div>
        </div>
    </section>

    <!-- 3. مكون أزرار الطلب العائمة (Floating Buttons) -->
    <div class="floating-order-container">
        <!-- زرار واتساب -->
        <a href="https://wa.me/966555209466?text=مرحباً%20قصر%20الشواية،%20أرغب%20في%20تقديم%20طلب:%20" 
           target="_blank" 
           class="btn-order whatsapp-btn" 
           aria-label="اطلب عبر الواتساب">
            <i class="fab fa-whatsapp"></i>
            <span>اطلب واتساب</span>
        </a>
        
        <!-- زرار الاتصال -->
        <a href="tel:+966555209466" 
           class="btn-order call-btn" 
           aria-label="اتصل بنا">
            <i class="fas fa-phone-alt"></i>
            <span>اتصل بنا</span>
        </a>
    </div>

    <!-- ملف الجافاسكريبت -->
    <script src="js/main.js"></script>
</body>
</html>
